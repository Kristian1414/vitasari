name: Deploy ke GitHub Pages

on:
  push:
    branches: [main]
  # Memungkinkan menjalankan deploy manual dari tab Actions.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Kalau ada push baru saat deploy berjalan, yang lama dibatalkan.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pasang dependensi
        run: npm ci

      - name: Build produksi
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
